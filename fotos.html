<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fotos y mensajes · Cumple de Valentín</title>
<meta name="description" content="Sube tus fotos y videos del cumpleaños de Valentín y déjale un mensaje.">
<meta name="theme-color" content="#12337e">
<meta property="og:title" content="Comparte tus fotos del cumple de Valentín 📸">
<meta property="og:image" content="https://jetsonchile-bit.github.io/cumple-valentin/video/v0.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500&family=Inter:wght@400;600;700&display=swap">
<style>
  :root{ --oro:#f4c95d; --tenue:#c9d3ee; --azul2:#12337e; }
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;min-height:100vh;background:linear-gradient(180deg,#2a63d4 0%,#163d94 45%,#0f2a6b 100%) fixed;color:#f2f2f5;
    font:400 17px/1.5 "Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:18px 16px 40px;overflow-x:hidden}
  .wrap{max-width:520px;margin:0 auto}
  header{text-align:center;margin:4px 0 18px}
  .feliz{font:400 26px/1 "Anton",Impact,sans-serif;letter-spacing:.04em;color:#eef2f8;text-shadow:0 2px 0 rgba(20,30,60,.7),0 0 14px rgba(220,235,255,.6)}
  .nombre{font:400 60px/1.05 "Anton",Impact,sans-serif;letter-spacing:.03em;margin:2px 0 6px;color:transparent;
    background:linear-gradient(180deg,#fffbe6 0%,#ffe27a 22%,#f4c95d 40%,#a8740f 52%,#ffe9a0 66%,#f7c948 82%,#fff3c2 100%);
    -webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 2px 0 rgba(90,55,0,.8)) drop-shadow(0 0 16px rgba(255,210,90,.6))}
  .sub{font:500 13px "Oswald",sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--oro)}
  .caja{position:relative;border:3px solid transparent;border-radius:22px;padding:20px 18px;margin:0 0 18px;
    background:linear-gradient(180deg,rgba(22,52,140,.94),rgba(12,32,95,.96)) padding-box,
      linear-gradient(135deg,#fff6cd,#f4c95d 18%,#9a6b12 32%,#ffffff 48%,#a3abbd 60%,#ffe08a 76%,#c08f2c) border-box;
    box-shadow:0 0 26px rgba(244,201,93,.45),0 18px 50px rgba(8,25,80,.5)}
  h2{margin:0 0 12px;text-align:center;font:400 27px/1.15 "Anton",Impact,sans-serif;letter-spacing:.03em;text-transform:uppercase;color:#fff}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;margin:10px 0 0;border:none;border-radius:16px;cursor:pointer;
    font:700 19px "Inter",sans-serif;color:#241700;background:linear-gradient(180deg,#ffe08a,#c08f2c);
    box-shadow:0 0 0 2px rgba(255,255,255,.5),0 8px 22px rgba(244,201,93,.45),inset 0 1px 0 rgba(255,255,255,.7);-webkit-tap-highlight-color:transparent}
  .btn:active{transform:scale(.98)}
  .btn.sec{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
  .btn[disabled]{opacity:.6}
  .fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fila .btn{margin-top:0}
  label{display:block;font:500 12px "Oswald",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--oro);margin:12px 0 6px}
  input[type=text],textarea{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid rgba(227,231,239,.7);background:rgba(255,255,255,.12);color:#fff;font:400 17px "Inter",sans-serif}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--oro);box-shadow:0 0 0 3px rgba(244,201,93,.3)}
  textarea{min-height:96px;resize:vertical}
  ::placeholder{color:rgba(255,255,255,.55)}
  .msg{min-height:22px;margin-top:10px;text-align:center;font-weight:600}
  .ok{color:#9ff0c4} .err{color:#ffb4b4}
  .barra{height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:12px}
  .barra span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe08a,#c08f2c);transition:width .3s}
  .prev{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
  .prev img,.prev video{width:64px;height:64px;object-fit:cover;border-radius:8px}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .grid img,.grid video{display:block;min-width:0;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:rgba(0,0,0,.2)}
  .nota{color:var(--tenue);font-size:14px;text-align:center;margin:4px 0 0}
  .pie{text-align:center;margin-top:8px} .pie a{color:var(--oro);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="feliz">FELIZ CUMPLE</div>
    <div class="nombre">VALENTÍN</div>
    <div class="sub">Comparte tus fotos y videos</div>
  </header>

  <section class="caja" id="cajaFotos">
    <h2>📸 Sube tus fotos</h2>
    <button class="btn" id="btnFoto">📸 Tomar foto</button>
    <div class="fila" style="margin-top:10px">
      <button class="btn sec" id="btnVideo">🎥 Grabar video</button>
      <button class="btn sec" id="btnGaleria">🖼️ De mi galería</button>
    </div>
    <input type="file" id="inFoto" accept="image/*" capture="environment" hidden>
    <input type="file" id="inVideo" accept="video/*" capture="environment" hidden>
    <input type="file" id="inGaleria" accept="image/*,video/*" multiple hidden>
    <div class="prev" id="prev"></div>
    <div class="barra" id="barra" hidden><span id="barraIn"></span></div>
    <div class="msg" id="fotoMsg"></div>
    <p class="nota"><b style="color:var(--oro);font-size:16px">🎥 Deja un video de recuerdo de 20 segundos</b><br>Las fotos y videos se suben solos apenas los tomas.</p>
  </section>

  <section class="caja">
    <h2>💌 Mensaje para Valentín</h2>
    <label for="fNombre">Tu nombre</label>
    <input type="text" id="fNombre" placeholder="Tu nombre" maxlength="80" autocomplete="name">
    <label for="fMensaje">Tu mensaje</label>
    <textarea id="fMensaje" placeholder="¡Feliz cumpleaños, Súper Valentín! 🦸" maxlength="1000"></textarea>
    <button class="btn" id="btnMensaje">Enviar mi mensaje</button>
    <div class="msg" id="felicMsg"></div>
  </section>

  <section class="caja" id="cajaGaleria" hidden>
    <h2>Fotos de la fiesta</h2>
    <div class="grid" id="grid"></div>
  </section>

  <p class="pie"><a id="verInv" href="index.html">Ver la invitación completa</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
<script>
const sb = supabase.createClient("https://fqajmcvrijjthbgqhpgl.supabase.co", "sb_publishable_VgfrzNKCje9xD4pkYXjmDA_jeabiZA1");
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const INV = new URLSearchParams(location.search).get('inv');
if(INV) $('verInv').href = 'index.html?inv=' + encodeURIComponent(INV);

/* ---- fotos y videos: se suben apenas se eligen o se toman ---- */
const VIDEO_MAX = 90*1024*1024;   // igual que el límite del bucket
let subiendo = false;
$('btnFoto').onclick = () => { if(!subiendo) $('inFoto').click(); };
$('btnVideo').onclick = () => { if(!subiendo) $('inVideo').click(); };
$('btnGaleria').onclick = () => { if(!subiendo) $('inGaleria').click(); };
['inFoto','inVideo','inGaleria'].forEach(id => $(id).addEventListener('change', e => {
  const archivos = [...e.target.files].filter(f => f.type.startsWith('image/') || f.type.startsWith('video/') || /\.(jpe?g|png|webp|heic|heif|mp4|mov|webm|m4v)$/i.test(f.name));
  e.target.value = '';
  if(archivos.length) subir(archivos);
}));

async function comprimir(f){
  if(!window.imageCompression) return f;
  try{ return await imageCompression(f,{ maxSizeMB:0.6, maxWidthOrHeight:1920, initialQuality:0.82, fileType:'image/jpeg', useWebWorker:true }); }
  catch(e){ return f.size<=8*1024*1024 ? f : null; }
}
function extVideo(mime){
  mime = mime || '';
  if(mime.includes('mp4')) return 'mp4';
  if(mime.includes('webm')) return 'webm';
  if(mime.includes('quicktime')) return 'mov';
  return 'mp4';
}
async function subirUna(f){
  const video = f.type.startsWith('video/');
  let c, path, tipo, contentType;
  if(video){
    if(f.size > VIDEO_MAX) throw new Error('video muy pesado');
    c = f; tipo = 'video'; contentType = f.type || 'video/mp4';
    path = 'v-' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + extVideo(f.type);
  } else {
    c = await comprimir(f); if(!c) throw new Error('muy grande');
    tipo = 'foto'; contentType = 'image/jpeg';
    path = Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.jpg';
  }
  const { error:upErr } = await sb.storage.from('cv-galeria').upload(path, c, { upsert:false, contentType });
  if(upErr) throw upErr;
  const { data:{ publicUrl } } = sb.storage.from('cv-galeria').getPublicUrl(path);
  const { error } = await sb.from('cv_galeria').insert({ tipo, url:publicUrl, path });
  if(error) throw error;
}
async function subir(archivos){
  subiendo = true;
  ['btnFoto','btnVideo','btnGaleria'].forEach(id => $(id).disabled = true);
  $('prev').innerHTML = archivos.slice(0,10).map(f => {
    const u = URL.createObjectURL(f);
    return f.type.startsWith('video/') ? `<video src="${u}" muted playsinline></video>` : `<img src="${u}" alt="">`;
  }).join('');
  $('fotoMsg').className = 'msg'; $('barra').hidden = false;
  const total = archivos.length; let hechas = 0, fallos = 0, largos = 0, i = 0;
  const avance = () => { $('fotoMsg').textContent = `Subiendo ${Math.min(hechas+1,total)} de ${total}…`; $('barraIn').style.width = (hechas/total*100) + '%'; };
  avance();
  async function trabajador(){ while(i < total){ const f = archivos[i++]; try{ await subirUna(f); }catch(e){ fallos++; if(e && e.message === 'video muy pesado') largos++; } hechas++; avance(); } }
  await Promise.all([trabajador(), trabajador()]);
  $('barraIn').style.width = '100%';
  if(fallos){
    $('fotoMsg').className = 'msg err';
    const parte = total > fallos ? `Se subieron ${total-fallos} de ${total}. ` : '';
    $('fotoMsg').textContent = largos === fallos
      ? parte + 'Ese video es muy largo: deja un video de recuerdo de 20 segundos 🎥'
      : `Se subieron ${total-fallos} de ${total}. Intenta de nuevo con lo que faltó.`;
  } else {
    $('fotoMsg').className = 'msg ok';
    $('fotoMsg').textContent = total === 1 ? '¡Listo! Ya está en la galería de la fiesta 🎉' : `¡Listo! Tus ${total} archivos ya están en la galería 🎉`;
  }
  setTimeout(() => { $('barra').hidden = true; $('barraIn').style.width = '0'; $('prev').innerHTML = ''; }, 2500);
  ['btnFoto','btnVideo','btnGaleria'].forEach(id => $(id).disabled = false);
  subiendo = false;
  cargarGaleria();
}

/* ---- mensaje para Valentín ---- */
try{ $('fNombre').value = localStorage.getItem('cv_nombre') || ''; }catch(e){}
$('btnMensaje').addEventListener('click', async () => {
  const nombre = $('fNombre').value.trim(), mensaje = $('fMensaje').value.trim();
  $('felicMsg').className = 'msg';
  if(!nombre || !mensaje){ $('felicMsg').className = 'msg err'; $('felicMsg').textContent = 'Escribe tu nombre y tu mensaje.'; return; }
  $('btnMensaje').disabled = true; $('felicMsg').textContent = 'Enviando…';
  const { error } = await sb.from('cv_felicitaciones').insert({ nombre, mensaje });
  $('btnMensaje').disabled = false;
  if(error){ $('felicMsg').className = 'msg err'; $('felicMsg').textContent = 'No se pudo enviar. Intenta de nuevo.'; return; }
  try{ localStorage.setItem('cv_nombre', nombre); }catch(e){}
  $('fMensaje').value = '';
  $('felicMsg').className = 'msg ok'; $('felicMsg').textContent = '¡Gracias por tu mensaje! 💙';
});

/* ---- últimas fotos y videos de la fiesta ---- */
async function cargarGaleria(){
  const { data } = await sb.from('cv_galeria').select('url,tipo').in('tipo',['foto','video']).eq('oculto',false).order('created_at',{ascending:false}).limit(18);
  if(!data || !data.length) return;
  $('grid').innerHTML = data.map(g => g.tipo === 'video'
    ? `<video src="${esc(g.url)}" controls preload="metadata" playsinline></video>`
    : `<img src="${esc(g.url)}" loading="lazy" alt="">`).join('');
  $('cajaGaleria').hidden = false;
}
cargarGaleria();
</script>
</body>
</html>
